name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach the card to the release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/energy-budget-card.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
